services:

  minio:
    image: minio/minio:latest
    container_name: minio_galaxies
    ports:
      - "9000:9000"   # API (отсюда браузер берёт картинки)
      - "9001:9001"   # веб-консоль
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  minio_data:
