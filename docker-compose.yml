services:

  minio:
    image: minio/minio:latest
    container_name: minio_galaxies
    ports:
      - "9000:9000"   # API (отсюда браузер берёт картинки)
      - "9001:9001"   # веб-консоль
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  db:
    image: postgres:15
    container_name: galaxy_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: galaxy_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro

  adminer:
    image: adminer
    container_name: galaxy_adminer
    ports:
      - "8081:8080"

volumes:
  minio_data:
  postgres_data: