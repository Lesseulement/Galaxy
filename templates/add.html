{% extends "base.html" %}
{% from "_macros.html" import media %}
{% block title %}Черновик{% endblock %}
{% block content %}
  <h1 class="page-title">Регистрация сверхновой</h1>

  <div class="group">
    <span class="label">Фото</span>
    <div class="preview">{{ media(draft.image_key, 'default.jpg', 'preview-media') }}</div>
  </div>
  <div class="group">
    <span class="label">Видео</span>
    <div class="preview">{{ media(draft.video_key, DEFAULT_VIDEO, 'preview-media') }}</div>
  </div>

  <div class="form">
    <label class="group"><span class="label">Название</span>
      <input class="field" value="{{ draft.title }}">
    </label>
    <label class="group"><span class="label">ID сверхновой</span>
      <input class="field" value="{{ draft.supernova }}">
    </label>
    <div class="row">
      <label class="group"><span class="label">Видимая величина, m</span>
        <input class="field" value="{{ fmt(draft.magnitude) }}">
      </label>
      <label class="group"><span class="label">Расстояние, Мпк</span>
        <input class="field" value="{{ fmt(draft.distance_mpc) }}">
      </label>
    </div>
    <label class="group"><span class="label">Описание</span>
      <textarea class="field" rows="3">{{ draft.description }}</textarea>
    </label>
    <button class="btn" type="button">Опубликовать</button>
  </div>
{% endblock %}
