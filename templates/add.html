<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавление галактики</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .mobile-container {
            width: 100%;
            max-width: 412px;
            height: 100vh;
            max-height: 892px;
            background-color: #0f172a;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .header {
            padding: 24px 20px 12px;
            text-align: left;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
        }

        .form-container {
            padding: 0 20px 20px;
            overflow-y: auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 500;
        }

        .form-input, .form-textarea {
            width: 100%;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px 14px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .form-input:focus, .form-textarea:focus {
            border-color: #d97706;
        }

        .form-textarea {
            resize: none;
            height: 90px;
        }

        .media-preview {
            width: 100%;
            height: 140px;
            background-color: #1e293b;
            border: 1px dashed #475569;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #94a3b8;
            font-size: 13px;
            overflow: hidden;
            position: relative;
        }

        .media-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #d97706, #f59e0b);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s ease;
            margin-top: 8px;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        /* Нижняя навигация */
        .bottom-nav {
            height: 60px;
            background-color: #0f172a;
            border-top: 1px solid #1e293b;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 10;
        }

        .nav-item {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            width: 44px;
            height: 44px;
        }

        .nav-item.active svg {
            stroke: #d97706;
        }
    </style>
</head>
<body>

  <div class="mobile-container">
    <div>
      <div class="header">
        <h1>Черновик / Добавление</h1>
      </div>

      <form action="/add" method="post" class="form-container">
        
        <!-- Предпросмотр обложки (MinIO) -->
        <div class="form-group">
          <label>Обложка галактики (MinIO)</label>
          <div class="media-preview">
            {% if item and item.media_url %}
              <img src="{{ item.media_url }}" alt="Превью обложки">
            {% else %}
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21 15 16 10 5 21"/>
              </svg>
              <span>Черновик обложки</span>
            {% endif %}
          </div>
          <input type="hidden" name="media_key" value="{{ item.media_key if item and item.media_key else 'draft.jpg' }}">
        </div>

        <div class="form-group">
          <label for="title">Название объекта</label>
          <input type="text" id="title" name="title" class="form-input" value="{{ item.title if item and item.title else '' }}" placeholder="Например: M 31 (Андромеда)" required>
        </div>

        <div class="form-group">
          <label for="description">Описание</label>
          <textarea id="description" name="description" class="form-textarea" placeholder="Краткая информация..." required>{{ item.description if item and item.description else '' }}</textarea>
        </div>

        <div class="form-group">
          <label for="distance_mpc">Расстояние (Мпк)</label>
          <input type="number" step="0.01" id="distance_mpc" name="distance_mpc" class="form-input" value="{{ item.distance_mpc if item and item.distance_mpc else '' }}" placeholder="Например: 2.5" required>
        </div>

        <div class="form-group">
          <label for="magnitude">Звездная величина (m)</label>
          <input type="number" step="0.01" id="magnitude" name="magnitude" class="form-input" value="{{ item.magnitude if item and item.magnitude else '' }}" placeholder="Например: 3.4" required>
        </div>

        <button type="submit" class="submit-btn">Опубликовать галактику</button>
      </form>
    </div>

    <!-- Нижняя навигация -->
    <nav class="bottom-nav">
      <a href="/feed/1" class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </a>
      
      <a href="/draft" class="nav-item active">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </a>
      
      <a href="/" class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"/>
          <rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/>
        </svg>
      </a>
    </nav>
  </div>

</body>
</html>
