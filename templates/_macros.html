{# фото или видео из MinIO #}
{% macro media(key, default, cls='') -%}
  {%- if is_video(key) -%}
    <video class="{{ cls }}" src="{{ media_url(key, default) }}" autoplay muted loop playsinline></video>
  {%- else -%}
    <img class="{{ cls }}" src="{{ media_url(key, default) }}" alt="">
  {%- endif -%}
{%- endmacro %}

{% macro heart(filled=false) -%}
<svg class="heart {{ 'is-filled' if filled }}" viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/></svg>
{%- endmacro %}
