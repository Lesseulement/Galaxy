<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Галактики{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="phone">
    <main class="screen {% block screen_class %}{% endblock %}">
      {% block content %}{% endblock %}
    </main>

    <nav class="tabbar">
      <a href="/feed" class="tab {{ 'is-active' if active == 'feed' }}" aria-label="Лента">
        <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
      </a>
      <a href="/add" class="tab {{ 'is-active' if active == 'add' }}" aria-label="Добавление">
        <svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg>
      </a>
      <a href="/" class="tab {{ 'is-active' if active == 'grid' }}" aria-label="Сетка">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>
      </a>
    </nav>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
