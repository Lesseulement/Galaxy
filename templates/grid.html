<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>База галактик</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <div class="mobile-container">
    <div class="content grid-padding">
      
      <div class="title">База галактик</div>

      <div class="search-box">
        <input type="text" placeholder="Поиск по названию галактики">
      </div>

      <div class="grid-container">
        {% for item in items %}
        <a href="/feed/{{ item.id }}" class="card" style="background-image: url('{{ item.media_url }}');">
          <div class="card-overlay">
            <div class="card-title">{{ item.title }}</div>
            <div class="card-likes">♡ {{ item.likes_count }}k</div>
          </div>
        </a>
        {% endfor %}
      </div>

    </div>

    <!-- Навигация -->
    <nav class="bottom-nav">
      <a href="/feed/1" class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </a>
      <a href="/draft" class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </a>
      <a href="/" class="nav-item active">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      </a>
    </nav>
  </div>

</body>
</html>
